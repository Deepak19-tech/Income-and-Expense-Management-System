{% extends 'finance/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        {% load static %}
        <div class="card shadow-sm p-4">
            <div class="text-center mb-3">
                <img src="{% static 'img/logo.svg' %}" alt="HisabKitab" height="80">
            </div>
            <h2 class="mb-4">Sign In</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="login_username">Username</label>
                    <input id="login_username" type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="login_password">Password</label>
                    <input id="login_password" type="password" class="form-control" name="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
            <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
